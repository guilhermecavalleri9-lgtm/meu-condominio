# Publica o app no Render com https automático.
# No painel: New → Blueprint → aponte para este repositório.
services:
  - type: web
    name: meu-condominio
    runtime: node
    plan: free
    region: oregon
    buildCommand: ""            # não há dependências para instalar
    # a versão do Node fica fixa em .node-version: deixar "engines: >=18" solto
    # fez o Render instalar um Node 26 alpha e o build quebrar
    startCommand: node server.js
    healthCheckPath: /api/sessao
    envVars:
      - key: NODE_VERSION
        value: "22.20.0"
      # assina as sessões; o Render gera um valor aleatório e guarda
      - key: PORTARIA_SECRET
        generateValue: true
      # ── dados ──────────────────────────────────────────────────────────────
      # O disco do plano free é apagado quando o serviço dorme ou reinicia: use o
      # Supabase para não perder cadastro, encomendas e contas. Preencha no painel.
      # SUPABASE_KEY precisa ser a service_role key (secreta), não a anon.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # ── WhatsApp automático (opcional) ─────────────────────────────────────
      # exige um código para criar a conta de administrador (app exposto na internet)
      - key: PORTARIA_CODIGO_ADMIN
        sync: false
      - key: WHATSAPP_PROVIDER
        sync: false
      - key: ZAPI_INSTANCE
        sync: false
      - key: ZAPI_TOKEN
        sync: false
      - key: ZAPI_CLIENT_TOKEN
        sync: false
